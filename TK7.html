<head>

  <title>Bài TK7: Tạo chuỗi ngẫu nhiên</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 16px; }
    #ketQua { font-size: 28px; font-family: monospace; letter-spacing: 3px; background: #f3f4f6;
      padding: 16px; border-radius: 8px; text-align: center; margin: 16px 0; }
    button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <p><a href="bt39.html">← Về trang chủ</a></p>
  <h1>Bài TK7: Tạo chuỗi ngẫu nhiên</h1>
  <p>Họ tên: Đỗ Huy Nhật Em | MSSV: 241A010437</p>

  <div id="ketQua">--------</div>
  <button id="btnTao">Tạo mật khẩu</button>

  <script>
    // Hàm tạo chuỗi mật khẩu ngẫu nhiên gồm chữ cái thường và số
    function taoMatKhau(doDai) {
      var chuCai = "abcdefghijklmnopqrstuvwxyz";
      var so = "0123456789";
      var tatCa = chuCai + so;
      var kq = [];

      // Đảm bảo có ít nhất 1 chữ cái và 1 số
      kq.push(chuCai[Math.floor(Math.random() * chuCai.length)]);
      kq.push(so[Math.floor(Math.random() * so.length)]);

      // Các ký tự còn lại lấy ngẫu nhiên
      while (kq.length < doDai) {
        kq.push(tatCa[Math.floor(Math.random() * tatCa.length)]);
      }

      // Trộn thứ tự ngẫu nhiên
      for (var i = kq.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tam = kq[i]; kq[i] = kq[j]; kq[j] = tam;
      }
      return kq.join("");
    }

    var elKetQua = document.getElementById("ketQua");
    document.getElementById("btnTao").addEventListener("click", function () {
      elKetQua.textContent = taoMatKhau(8);
    });
    elKetQua.textContent = taoMatKhau(8);
  </script>
</body>
